name: Build cross-platform artifacts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  # ──────────────────────────────────────────────
  #  LINUX  →  dist/PostureApp  +  .AppImage
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # dlib needs: cmake, boost, c++ headers; OpenCV/Qt need: libGL, libXkb
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget cmake build-essential \
            libboost-all-dev python3-dev \
            libgl1-mesa-glx libglib2.0-0 \
            libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      # Install directly into the setup-python interpreter — no venv needed in CI
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r requirements.txt

      - name: Build and Package Linux Installers
        run: |
          chmod +x build_release_installer_linux.sh
          ./build_release_installer_linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/PostureCam-Linux.tar.gz

  # ──────────────────────────────────────────────
  #  MACOS  →  dist/PostureApp  zipped as DMG-ready .zip
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # dlib needs cmake on macOS (brew ships it already on GitHub runners,
      # but be explicit to avoid flakiness)
      - name: Install system dependencies
        run: |
          brew install cmake || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r requirements.txt

      - name: Build and Package macOS Installer
        run: |
          chmod +x build_release_installer_mac.sh
          ./build_release_installer_mac.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/PostureCamSetup.dmg

  # ──────────────────────────────────────────────
  #  WINDOWS  →  dist/PostureApp  + Inno Setup installer
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -r requirements.txt

      - name: Build and Package Windows Installer
        run: .\build_release_installer.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist\PostureCamSetup.exe
